name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  vpk:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - name: Install build tools
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache git bash cmake samurai ninja || apk add --no-cache git bash cmake ninja
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends git bash cmake ninja-build
          else
            echo "no known package manager in this image"; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build
        shell: bash
        run: |
          mkdir -p build
          bash tools/build.sh 2>&1 | tee build/ci.log
          exit ${PIPESTATUS[0]}

      - name: Report the failing lines
        if: failure()
        shell: bash
        run: |
          grep -nE 'error:|FAILED:|undefined reference|No such file|CMake Error|ninja: build stopped' build/ci.log | head -40 | sed 's/^/::error::/'
          tail -60 build/ci.log | sed 's/^/::notice::/'
          true

      - uses: actions/upload-artifact@v4
        with:
          name: JAVITA-vpk
          path: |
            build/JAVITA.vpk
            build/JAMPVITA.vpk
          if-no-files-found: error
