name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  vpk:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - name: Install build tools
        run: apk add --no-cache git bash cmake ninja-build samurai || apk add --no-cache git bash cmake ninja

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: bash tools/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: JAVITA-vpk
          path: build/JAVITA.vpk
          if-no-files-found: error
